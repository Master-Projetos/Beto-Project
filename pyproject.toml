[project]
name = "beto-project"
version = "0.0.1"
description = ""
authors = [
    {name = "Eduardo",email = "eduardo.vchaves23@gmail.com"}
]
license = "MIT"
requires-python = ">=3.13,<4.0"
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
]

[dependency-groups]
dev = [
    "ruff (>=0.16.9,<0.17.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pyinstaller (>=6.22.3,<7.0.0) ; python_version < \"3.16\""
]
excel = [
    "xlwings (>=0.37.5,<0.38.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.taskipy.tasks]
run = 'python main.py'
build = 'pyinstaller --noconfirm --onefile --windowed --name ListaMateriais --exclude-module xlwings main.py'
lint = 'ruff check .'
format = 'ruff format .'
pos_format = 'ruff check . --fix'

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'